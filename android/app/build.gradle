plugins { id 'com.android.application' }
android {
    namespace 'com.acecoach.planner'
    compileSdk 35
    defaultConfig {
        applicationId 'com.acecoach.planner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.acecoach.planner.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
